plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}
version = project.mod_version
group = 'cn.blockforge.fatekings'
base { archivesName = 'fate-kings' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Development only: the Gojo x Sukuna mod next door, so the soft-compat rules run for real in
    // runClient / game tests. It is never bundled; the release works with or without it.
    def jjk = jjkJar()
    if (jjk != null) {
        localRuntime files(jjk)
    }
}

/** The newest jjk-gojo-sukuna release jar built next door (or null; -PnoJjk disables it). */
def jjkJar() {
    if (project.hasProperty('noJjk')) return null
    def dir = file('../jjk-gojo-sukuna/build/libs')
    if (!dir.isDirectory()) return null
    def jars = dir.listFiles().findAll { it.name ==~ /jjk-gojo-sukuna-.*\+mc26\.3\.jar/ && !it.name.contains('-sources') }
    return jars.isEmpty() ? null : jars.max { it.lastModified() }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25; options.compilerArgs += ['-Xmaxerrs', '1000'] }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

loom { accessWidenerPath = file("src/main/resources/fatekings.accesswidener") }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'fatekings-gametest'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

// The game tests (server and client) run with the Gojo x Sukuna mod too, when it is next door.
dependencies {
    def jjk = jjkJar()
    if (jjk != null) {
        gametestRuntimeOnly files(jjk)
    }
}

sourceSets {
    checks {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
tasks.register('verifyRules', JavaExec) {
    dependsOn checksClasses, processResources
    classpath = sourceSets.checks.runtimeClasspath
    mainClass = 'cn.blockforge.fatekings.checks.RulesCheck'
    args file('src/main/resources').absolutePath
}
tasks.named('check') { dependsOn 'verifyRules' }
